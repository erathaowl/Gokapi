name: Build custom Gokapi images

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request_target:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag (vX.Y.Z) or master for dev; leave empty for latest release"
        required: false
        type: string
      tag_master:
        description: "Also publish the master tag when building upstream master"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: custom-gokapi-images
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out customizations
        uses: actions/checkout@v4

      - name: Resolve upstream version and image tags
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          TAG_MASTER: ${{ inputs.tag_master }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            ref="master"
            source="fork"
          elif [[ -n "$INPUT_REF" ]]; then
            ref="$INPUT_REF"
            source="upstream"
          else
            ref="$(gh api repos/Forceu/Gokapi/releases/latest --jq '.tag_name')"
            source="upstream"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

          if [[ "$ref" == "master" ]]; then
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "tag_master=$TAG_MASTER" >> "$GITHUB_OUTPUT"
            echo "Building $source master as dev."
            exit 0
          fi

          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable upstream tag (vX.Y.Z) or master."
            exit 1
          fi

          if [[ "$(printf '%s\n' 'v2.2.5' "$ref" | sort -V | head -n 1)" != "v2.2.5" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $ref: patch targets upstream v2.2.5 and newer."
            exit 0
          fi

          latest="$(gh api repos/Forceu/Gokapi/releases/latest --jq '.tag_name')"
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [[ "$ref" == "$latest" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.resolve.outputs.run == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        if: steps.resolve.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing release image
        id: existing
        if: steps.resolve.outputs.run == 'true'
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          if [[ "$MODE" == "release" ]] && docker buildx imagetools inspect "$image:$REF" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Versioned image already exists: $image:$REF"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether the GitHub Release exists
        id: release_state
        if: steps.resolve.outputs.mode == 'release' && steps.resolve.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          if gh release view "$REF-custom" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release already exists: $REF-custom"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release needs to be created: $REF-custom"
          fi

      - name: Fetch source code
        if: steps.resolve.outputs.run == 'true' && (steps.existing.outputs.skip != 'true' || steps.release_state.outputs.missing == 'true')
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE" == "fork" ]]; then
            git clone "https://github.com/$GITHUB_REPOSITORY.git" upstream
            git -C upstream checkout --detach "$MERGE_COMMIT"
          else
            git clone https://github.com/Forceu/Gokapi.git upstream
            git -C upstream checkout --detach "$REF"
          fi

      - name: Apply custom patch
        if: steps.resolve.outputs.run == 'true' && (steps.existing.outputs.skip != 'true' || steps.release_state.outputs.missing == 'true') && steps.resolve.outputs.source == 'upstream'
        working-directory: upstream
        run: |
          set -euo pipefail
          git apply --3way "$GITHUB_WORKSPACE/patches/upload-defaults.patch"

      - name: Set up Go
        if: steps.resolve.outputs.run == 'true' && (steps.existing.outputs.skip != 'true' || steps.release_state.outputs.missing == 'true')
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum

      - name: Generate assets and run tests
        if: steps.resolve.outputs.run == 'true' && (steps.existing.outputs.skip != 'true' || steps.release_state.outputs.missing == 'true')
        working-directory: upstream
        run: |
          set -euo pipefail
          go generate ./...
          go test ./... -parallel 8 -count=1 -tags=test,noaws

      - name: Prepare exact release source snapshot
        if: steps.resolve.outputs.mode == 'release' && steps.release_state.outputs.missing == 'true'
        working-directory: upstream
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Apply custom upload defaults to Gokapi $REF"
          fi
          echo "Prepared source snapshot at $(git rev-parse HEAD)"

      - name: Build Linux binaries
        if: steps.resolve.outputs.run == 'true' && steps.existing.outputs.skip != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p bin
          flags="-s -w -X github.com/forceu/gokapi/internal/environment.IsDocker=true -X github.com/forceu/gokapi/internal/environment.Builder=CustomGitHubActions"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "$flags" -o "bin/gokapi-$arch" ./cmd/gokapi
          done

      - name: Publish multi-platform image
        if: steps.resolve.outputs.run == 'true' && steps.existing.outputs.skip != 'true'
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          REF: ${{ steps.resolve.outputs.ref }}
          IMAGE: ${{ steps.existing.outputs.image }}
          TAG_MASTER: ${{ steps.resolve.outputs.tag_master }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "dev" ]]; then
            tags=(--tag "$IMAGE:dev")
            if [[ "$TAG_MASTER" == "true" ]]; then
              tags+=(--tag "$IMAGE:master")
            fi
          else
            tags=(--tag "$IMAGE:$REF")
          fi

          docker buildx build \
            --file "$GITHUB_WORKSPACE/docker/Dockerfile.custom" \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --push upstream

      - name: Update moving release tags
        if: steps.resolve.outputs.run == 'true' && steps.resolve.outputs.mode == 'release' && steps.resolve.outputs.latest == 'true'
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          IMAGE: ${{ steps.existing.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:upstream" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$REF"

      - name: Create source tag and GitHub Release
        if: steps.resolve.outputs.mode == 'release' && steps.release_state.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.resolve.outputs.ref }}
          IMAGE: ${{ steps.existing.outputs.image }}
          IS_LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          release_tag="$REF-custom"

          docker buildx imagetools inspect "$IMAGE:$REF" >/dev/null
          gh auth setup-git
          git -C upstream remote add fork "https://github.com/$GITHUB_REPOSITORY.git"

          if git -C upstream ls-remote --exit-code --tags fork "refs/tags/$release_tag" >/dev/null 2>&1; then
            git -C upstream fetch --no-tags fork "refs/tags/$release_tag:refs/tags/$release_tag"
            tagged_tree="$(git -C upstream rev-parse "$release_tag^{tree}")"
            source_tree="$(git -C upstream rev-parse "HEAD^{tree}")"
            if [[ "$tagged_tree" != "$source_tree" ]]; then
              echo "::error::Existing tag $release_tag points to different source contents."
              exit 1
            fi
          else
            git -C upstream tag -a "$release_tag" -m "Gokapi $REF with custom upload defaults"
            git -C upstream push fork "refs/tags/$release_tag"
          fi

          source_commit="$(git -C upstream rev-parse "$release_tag^{commit}")"
          digest="$(docker buildx imagetools inspect "$IMAGE:$REF" | awk '/^Digest:/ {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Cannot read the published image digest."
            exit 1
          fi

          {
            echo "Gokapi $REF with configurable default upload limits."
            echo
            echo "- Upstream release: https://github.com/Forceu/Gokapi/releases/tag/$REF"
            echo "- Patched source commit: $source_commit"
            echo "- Docker image: ${IMAGE}:${REF}"
            echo "- Docker digest: $digest"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Configuration: GOKAPI_DEFAULT_DOWNLOADS and GOKAPI_DEFAULT_EXPIRY_DAYS"
            echo "- Patch: https://github.com/$GITHUB_REPOSITORY/blob/master/patches/upload-defaults.patch"
          } > "$RUNNER_TEMP/release-notes.md"

          latest_option="--latest=false"
          if [[ "$IS_LATEST" == "true" ]]; then
            latest_option="--latest"
          fi

          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Gokapi $REF (custom)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$latest_option"

          echo "Created GitHub Release $release_tag from $source_commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed build
        if: ${{ failure() && steps.resolve.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          title="Custom Gokapi build failed for $REF"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title \
              --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The custom build for upstream $REF failed. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for details."
          fi
