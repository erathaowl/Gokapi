name: Build custom Gokapi releases

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag (vX.Y.Z) or master for validation; empty means latest release"
        required: false
        type: string
  push:
    branches:
      - automation/custom-release-build

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: custom-gokapi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out customizations
        uses: actions/checkout@v4

      - name: Resolve upstream version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            ref="master"
          elif [[ -n "$INPUT_REF" ]]; then
            ref="$INPUT_REF"
          else
            ref="$(gh api repos/Forceu/Gokapi/releases/latest --jq '.tag_name')"
          fi

          if [[ "$ref" == "master" ]]; then
            echo "ref=master" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Validating current upstream master without publishing."
            exit 0
          fi

          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable tag such as v2.2.5, or master for validation."
            exit 1
          fi

          if [[ "$(printf '%s\n' 'v2.2.5' "$ref" | sort -V | head -n 1)" != "v2.2.5" ]]; then
            echo "Skipping $ref: patch targets Gokapi 2.2.5 and newer."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(gh api repos/Forceu/Gokapi/releases/latest --jq '.tag_name')"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$ref" == "$latest" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip images already published
        id: existing
        if: steps.resolve.outputs.publish == 'true'
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:$REF-custom" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image already published: $image:$REF-custom"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream source
        if: steps.resolve.outputs.run == 'true' && steps.existing.outputs.skip != 'true'
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          git clone https://github.com/Forceu/Gokapi.git upstream
          git -C upstream checkout --detach "$REF"

      - name: Apply custom patch
        if: steps.resolve.outputs.run == 'true' && steps.existing.outputs.skip != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          git apply --3way "$GITHUB_WORKSPACE/patches/upload-defaults.patch"

      - name: Set up Go
        if: steps.resolve.outputs.run == 'true' && steps.existing.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum

      - name: Generate assets and run tests
        if: steps.resolve.outputs.run == 'true' && steps.existing.outputs.skip != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          go generate ./...
          go test ./... -parallel 8 -count=1 -tags=test,noaws

      - name: Build Linux binaries
        if: steps.resolve.outputs.run == 'true' && steps.existing.outputs.skip != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p bin
          flags="-s -w -X github.com/forceu/gokapi/internal/environment.IsDocker=true -X github.com/forceu/gokapi/internal/environment.Builder=CustomGitHubActions"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "$flags" -o "bin/gokapi-$arch" ./cmd/gokapi
          done

      - name: Publish multi-platform image
        if: steps.resolve.outputs.publish == 'true' && steps.existing.outputs.skip != 'true'
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          IMAGE: ${{ steps.existing.outputs.image }}
          IS_LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:$REF-custom")
          if [[ "$IS_LATEST" == "true" ]]; then
            tags+=(--tag "$IMAGE:latest-custom")
          fi

          docker buildx build \
            --file "$GITHUB_WORKSPACE/docker/Dockerfile.custom" \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --push upstream

      - name: Report failed custom release
        if: ${{ failure() && steps.resolve.outputs.publish == 'true' && steps.existing.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          title="Custom Gokapi build failed for $REF"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title \
              --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The custom build for upstream $REF failed. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for details."
          fi
